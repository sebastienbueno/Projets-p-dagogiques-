<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copa del Mundo 2026 – ¡Lleva a España a la final!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --bg2:#e3e8f4; --card:#ffffff; --ink:#0d1433; --muted:#5b6487; --line:#d3daeb;
  --rojo:#e4002b; --oro:#ffc400; --cian:#00b8c6; --verde:#0f8a4a; --okbg:#dcf5e7;
  --errbg:#ffe3e8; --rojoT:#d1002a; --glow:rgba(228,0,43,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070b1e; --bg2:#0f1636; --card:#121a3a; --ink:#eef2ff; --muted:#9aa6d1; --line:#27315c;
    --verde:#3ee08a; --okbg:#0f3326; --errbg:#3b0f1b; --rojoT:#ff5a76; --glow:rgba(228,0,43,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#070b1e; --bg2:#0f1636; --card:#121a3a; --ink:#eef2ff; --muted:#9aa6d1; --line:#27315c;
  --verde:#3ee08a; --okbg:#0f3326; --errbg:#3b0f1b; --rojoT:#ff5a76; --glow:rgba(228,0,43,.22);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(900px 500px at 15% -10%,var(--glow),transparent 70%),
                   radial-gradient(700px 420px at 100% 0%,rgba(0,184,198,.10),transparent 70%);
  font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rojo)}
h1{font-family:'Bebas Neue',Impact,'Arial Narrow Bold',sans-serif;font-weight:400;
  font-size:clamp(34px,9vw,60px);line-height:.92;letter-spacing:.01em;margin:4px 0 6px}
h1 .nom{background:linear-gradient(90deg,var(--rojo),#ff6a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:99px;background:var(--bg2);color:var(--muted);font-size:10px;letter-spacing:.04em;vertical-align:middle}
.sub{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:48ch}
.icon{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  font-size:20px;cursor:pointer;color:var(--ink)}
.icon[aria-pressed="false"]{opacity:.5}

/* ---------- Scène ---------- */
.stage{position:relative;border-radius:22px;overflow:hidden;background:#050a1c;
  box-shadow:0 18px 40px rgba(5,10,30,.35),0 0 0 1px rgba(255,255,255,.06) inset}
.stage svg{display:block;width:100%;height:auto}
.stage svg.capa{position:absolute;inset:0;height:100%}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.05em;font-size:clamp(15px,3.6vw,22px)}
.score{display:flex;border-radius:9px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.score span{padding:.18em .55em .08em}
.score .t{background:var(--rojo);color:#fff}
.score .t.riv{background:#5cc4f5;color:#0d1433}
.score .n{background:rgba(6,10,28,.88);color:#fff;min-width:3.4em;text-align:center}
.score .n b{display:inline-block;font-weight:400}
.score .n b.flip{animation:flip .6s}
@keyframes flip{0%{transform:scale(1)}40%{transform:scale(1.9);color:var(--oro)}100%{transform:scale(1)}}
.pts{background:rgba(6,10,28,.85);color:var(--oro);padding:.18em .6em .08em;border-radius:9px;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.cap{position:absolute;left:0;top:22%;pointer-events:none;opacity:0}
.tierPop{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 50%,rgba(10,14,40,.72),rgba(10,14,40,.45));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none;z-index:6;opacity:0}
.tierPop .rv-rayos{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;opacity:.7}
.tierPop .tpCard{position:relative;transform:scale(1.1);filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
.tierPop .tpTxt{position:relative;margin-top:6px;font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;letter-spacing:.08em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(255,255,255,.5)}
.tierPop.show{animation:tierIn 2.6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes tierIn{0%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1.05)}22%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.cap span{display:inline-block;font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(30px,8vw,62px);letter-spacing:.05em;
  color:#fff;padding:.06em .7em 0;background:linear-gradient(90deg,#e4002b,#ff3d5e);transform:skewX(-12deg);
  border-left:9px solid var(--oro);box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.cap.ko span{background:linear-gradient(90deg,#111633,#2b3156);border-left-color:#e4002b}
.cap.ok span{background:linear-gradient(90deg,#0f8a4a,#1fb866);border-left-color:#fff}
.cap.def span{background:linear-gradient(90deg,#b35c00,#ff9f1a);border-left-color:#111633}
.cap.show{animation:capIn 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes capIn{0%{opacity:0;transform:translateX(-110%)}18%{opacity:1;transform:translateX(18px)}
  26%{transform:translateX(10px)}80%{opacity:1;transform:translateX(20px)}100%{opacity:0;transform:translateX(60px)}}
.pop{position:absolute;left:24%;top:38%;pointer-events:none;font-family:'Bebas Neue',Impact,sans-serif;
  font-size:clamp(26px,6vw,44px);color:var(--oro);text-shadow:0 3px 0 #7a4b00,0 0 18px rgba(255,196,0,.6);opacity:0}
.pop.show{animation:popUp 1.1s ease-out forwards}
@keyframes popUp{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

.gol{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;visibility:hidden;overflow:hidden}
.gol.show{visibility:visible}
.rays{position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;opacity:0;
  background:repeating-conic-gradient(rgba(255,196,0,.20) 0 9deg,transparent 9deg 18deg)}
.gol.show .rays{animation:spin 9s linear infinite,fadeIn .5s forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{to{opacity:1}}
.golTxt{position:relative;text-align:center}
.big{display:flex;justify-content:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(74px,23vw,180px);line-height:.85;
  filter:drop-shadow(0 6px 0 #a3001c) drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.big span{display:inline-block;transform:scale(0);
  background:linear-gradient(180deg,#fffbe0 10%,#ffc400 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.gol.show .big span{animation:pop .5s cubic-bezier(.3,1.7,.5,1) var(--d) forwards,wob .7s ease-in-out calc(var(--d) + .55s) infinite alternate}
.banner{display:inline-block;margin-top:.3em;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;
  font-size:clamp(18px,4.6vw,32px);color:#fff;background:linear-gradient(90deg,#e4002b,#ff3d5e);padding:.12em .8em 0;
  transform:skewX(-10deg) scale(0);border-left:8px solid var(--oro)}
.gol.show .banner{animation:popB .5s cubic-bezier(.3,1.7,.5,1) .75s forwards}
@keyframes pop{to{transform:scale(1)}}
@keyframes popB{to{transform:skewX(-10deg) scale(1)}}
@keyframes wob{from{transform:scale(1) translateY(0)}to{transform:scale(1.07) translateY(-6px)}}
.confeti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(var(--h)) rotate(var(--r))}}

/* ---------- Progression ---------- */
.progreso{display:flex;align-items:center;gap:6px;margin:14px 2px 0}
.seg{flex:1;height:30px;border-radius:9px;background:var(--bg2);border:2px solid var(--line);display:grid;place-items:center;font-size:15px;
  transition:background .4s,border-color .4s,transform .4s}
.seg.on{background:linear-gradient(180deg,#ffd84d,#ffb300);border-color:#e09a00;transform:translateY(-2px)}
.seg.meta{border-style:dashed}
.progreso .cnt{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;color:var(--muted);min-width:2.6em;text-align:right}

/* ---------- Carte de jeu ---------- */
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 18px;
  box-shadow:0 8px 24px rgba(13,20,51,.08)}
.fila{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pill{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.08em;font-size:18px;color:#fff;background:var(--ink);
  padding:.15em .7em 0;border-radius:999px}
:root .pill{background:#0d1433;white-space:nowrap}
.fila .hint{font-size:14px;color:var(--muted)}
.actual{margin:0;font-size:clamp(20px,5.4vw,25px);line-height:1.9;padding:14px 16px;border-radius:16px;
  background:var(--bg2);border:2px solid var(--line);transition:background .3s,border-color .3s}
.actual.entra{animation:entra .5s cubic-bezier(.2,1.3,.5,1)}
.actual.bien{background:var(--okbg);border-color:var(--verde)}
.actual.ko{background:var(--errbg);border-color:var(--rojoT);color:var(--rojoT);animation:shake .45s}
@keyframes entra{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.inf{display:inline-block;font-size:.66em;font-weight:600;color:var(--muted);border:1.5px dashed var(--muted);
  border-radius:999px;padding:0 .6em;line-height:1.55;vertical-align:.14em;white-space:nowrap}
.actual.ko .inf{color:var(--rojoT);border-color:var(--rojoT)}
.gapin{font:inherit;font-weight:800;width:8.5ch;padding:.02em .3em;margin:0 .1em;text-align:center;color:var(--ink);
  background:var(--card);border:2px solid var(--line);border-bottom:4px solid var(--cian);border-radius:10px;outline:none}
.gapin:focus{box-shadow:0 0 0 4px rgba(0,184,198,.3)}
.gapin.err{color:var(--rojoT);border-color:var(--rojoT);background:var(--errbg);animation:halo 1s ease-out}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(228,0,43,.7)}100%{box-shadow:0 0 0 14px rgba(228,0,43,0)}}
.done{font-weight:800;color:var(--verde);background:var(--okbg);border-radius:8px;padding:.02em .35em}
.done.err{color:var(--rojoT);background:var(--errbg);text-decoration:line-through}
.fb{min-height:1.4em;margin:12px 0 0;font-weight:600;font-size:16px}
.fb.ok{color:var(--verde)} .fb.ko{color:var(--rojoT)}
.pista{margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--errbg);font-size:16px;line-height:1.45;border-left:4px solid var(--rojoT)}
.btn{margin-top:14px;font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:.07em;color:#fff;border:none;cursor:pointer;
  border-radius:14px;padding:.38em 1.6em .22em;background:linear-gradient(180deg,#ff2a4f,#c40024);
  box-shadow:0 5px 0 #8a0019,0 12px 22px rgba(228,0,43,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a0019,0 6px 12px rgba(228,0,43,.3)}
.btn:disabled{filter:grayscale(.7);opacity:.5;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--cian);outline-offset:3px}
.resumen .texto{margin:6px 0 0;font-size:17px;line-height:1.9}
.resumen .nueva{animation:entra .5s ease-out}
.resumen .inf{font-size:.75em}
.fin{text-align:center;padding:6px 0 0}
.fin .est{font-size:40px;letter-spacing:8px}
.fin .t{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(30px,8vw,44px);letter-spacing:.03em;color:var(--rojo);margin:.1em 0}
.fin p{font-size:17px;margin:.3em 0 .2em}
.top{flex-wrap:wrap}
.acciones-top{display:flex;gap:8px;flex:none}
.overlay.creador{place-items:stretch;padding:0;background:#050818}
.crea{width:100%;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;color:#fff;
  background:radial-gradient(120% 70% at 50% 28%,#2c49b0 0%,#111f58 45%,#070b1e 100%)}
.cr-stage{position:relative;flex:none;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;display:flex;flex-direction:column}
.cr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cr-top .eyebrow{color:var(--oro)}
.cr-top h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(32px,8.5vw,50px);line-height:.95;margin:2px 0 0;letter-spacing:.02em}
.cr-tools{display:flex;gap:8px;flex:none}
.tool{height:44px;min-width:44px;padding:0 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.tool[aria-pressed="false"]{opacity:.5}
.tool:active{transform:scale(.93)}
.tool.dado{font-size:22px}
.prevBox{position:relative;height:min(34vh,400px)}
.prevBox svg{display:block;width:100%;height:100%;transform-origin:50% 80%}
.prevBox.salta svg{animation:popAv .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes popAv{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.burbuja{position:relative;align-self:center;margin:8px auto 2px;max-width:min(92%,460px);min-height:1.35em;text-align:center;background:#fff;color:#0d1433;
  font-weight:600;font-size:15px;line-height:1.35;padding:8px 14px;border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.burbuja::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.burbuja.show{animation:burb .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes burb{from{transform:scale(.4) translateX(-20px);opacity:0}to{transform:none;opacity:1}}
.chispa{position:absolute;left:50%;top:55%;pointer-events:none;color:#ffc400;font-size:18px;animation:chispa .75s ease-out forwards}
@keyframes chispa{from{opacity:1;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.cr-panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);color:var(--ink);
  border-radius:26px 26px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.4)}
.tabs{display:flex;gap:6px;padding:12px 12px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border-radius:14px;border:none;
  background:var(--bg2);color:var(--muted);font:inherit;font-weight:700;font-size:12px;cursor:pointer;position:relative;transition:transform .15s}
.tab .ic{font-size:23px;line-height:1}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#ff2a4f,#c40024);color:#fff;box-shadow:0 4px 0 #8a0019;transform:translateY(-2px)}
.tab.hecho:not([aria-selected="true"])::after{content:"✓";position:absolute;top:3px;right:7px;font-size:11px;color:var(--verde);font-weight:800}
.cr-opts{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 16px;animation:entra .3s ease-out}
.cr-opts h3{margin:14px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--rojo);font-weight:800}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
.grid.g2{grid-template-columns:1fr 1fr}
.opc{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 6px;border-radius:16px;
  border:2.5px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-weight:700;font-size:13px;cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.opc svg{display:block;width:100%;max-width:78px;aspect-ratio:1;border-radius:12px;background:radial-gradient(circle at 50% 62%,#2f4fb8,#0b1438)}
.opc.alto svg{max-width:70px;aspect-ratio:124/232}
.opc:active{transform:scale(.95)}
.opc[aria-pressed="true"]{border-color:var(--oro);background:var(--card);transform:translateY(-3px);box-shadow:0 8px 16px rgba(255,180,0,.35)}
.opc .ok{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--oro);color:#3a1d00;font-size:13px;
  display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.opc[aria-pressed="true"] .ok{display:grid}
.opc .emo{font-size:46px;line-height:1.15}
.opc small{font-weight:500;font-size:12px;color:var(--muted);text-align:center;line-height:1.25}
.opc.gen{padding:14px 8px;font-size:18px}
.opc.cam svg{background:none;max-width:56px}
.sw2{display:flex;flex-wrap:wrap;gap:14px}
.sw2 button{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;color:var(--ink);font:inherit;
  font-weight:700;font-size:12px;cursor:pointer;padding:0;min-width:48px}
.sw2 i{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;border:3px solid var(--line);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .15s}
.sw2 button[aria-pressed="true"] i{border-color:var(--oro);transform:scale(1.12);box-shadow:0 0 0 4px rgba(255,196,0,.35),inset 0 -6px 0 rgba(0,0,0,.18)}
.sw2.ojos i{background:var(--bg2) !important;box-shadow:none}
.sw2.ojos svg{width:38px}
.campos{display:flex;gap:12px;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.campo input{font:inherit;font-size:20px;font-weight:700;padding:10px 14px;border-radius:14px;border:2.5px solid var(--line);
  background:var(--bg2);color:var(--ink);width:11em;outline:none}
.campo input:focus{border-color:var(--cian);box-shadow:0 0 0 4px rgba(0,184,198,.25)}
.campo input[type=number]{width:5em;text-align:center}
.desc{margin:0;padding:12px 14px;border-radius:14px;background:var(--bg2);border-left:4px solid var(--oro);font-size:16px;line-height:1.6}
.cr-nav{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cr-nav .btn{flex:1;margin:0;font-size:24px}
.nav-sec{flex:none;font:inherit;font-weight:700;font-size:15px;padding:0 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--bg2);color:var(--ink);cursor:pointer}
.nav-sec:disabled{opacity:.35;cursor:default}
.pills{position:absolute;inset:0;pointer-events:none}
.pills svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pills path{fill:none;stroke:rgba(255,255,255,.8);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 4}
.pdot{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;border:2.5px solid var(--cp,#ffc400);
  animation:latido 1.8s ease-in-out infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.etq{position:absolute;pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 7px;border-radius:999px;
  border:none;background:#fff;color:#0d1433;font:inherit;font-weight:700;font-size:13.5px;line-height:1.1;white-space:nowrap;cursor:pointer;
  box-shadow:0 5px 14px rgba(0,0,0,.35);animation:pillIn .4s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--dl,0s)}

/* ---------- Carta Ultimate (versión detallada) ---------- */
.futw{display:inline-block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4)) drop-shadow(0 0 12px var(--glow,transparent))}
.futw .fut{position:relative;width:200px;height:290px;padding:0;overflow:hidden;color:var(--ft);background:var(--fb);
  clip-path:polygon(14% 0,86% 0,100% 7%,100% 88%,50% 100%,0 88%,0 7%)}
.futw.bronce{--fb:linear-gradient(160deg,#f3c9a1,#b5743f 50%,#6b3a1f);--ft:#2e1405;--fl:#6b3a1f}
.futw.plata{--fb:linear-gradient(160deg,#ffffff,#c9d0db 50%,#7f8999);--ft:#1d2433;--fl:#5d6779}
.futw.oro{--fb:linear-gradient(160deg,#fff6c2,#f2c230 48%,#b8860b);--ft:#3a2600;--fl:#8a6300;--glow:rgba(255,200,40,.35)}
.futw.especial{--fb:linear-gradient(160deg,#f3d679 0%,#c99a2e 18%,#1a1a1a 42%,#111 60%,#8a6a1a 82%,#f0cf6a 100%);--ft:#ffe9a0;--fl:#f0cf6a;--glow:rgba(255,200,40,.45)}
.futw.heroe{--fb:linear-gradient(160deg,#c49bff,#5b2bbf 50%,#200756);--ft:#ffe680;--fl:#ffe680;--glow:rgba(170,110,255,.6)}
.futw.icono{--fb:linear-gradient(160deg,#fcfaf3,#efe6cc 50%,#cdb272);--ft:#4a3600;--fl:#a8862a;--glow:rgba(255,255,255,.35)}
.futw.icono .fut::after{background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 48%,transparent 60%);background-size:250% 100%;animation-duration:4.5s}
.futw.leyenda{--fb:linear-gradient(160deg,#ffe9a8 0%,#ff6a3d 45%,#5e0a7a 100%);--ft:#fff7d6;--fl:#ffd27a;--glow:rgba(255,120,60,.8)}
.futw.especial,.futw.heroe,.futw.icono,.futw.leyenda{animation:aura 2.4s ease-in-out infinite}
@keyframes aura{50%{filter:drop-shadow(0 10px 18px rgba(0,0,0,.4)) drop-shadow(0 0 22px var(--glow))}}
.futw .fut::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);
  background-size:250% 100%;animation:brillo 3.2s ease-in-out infinite;z-index:4}
.futw.bronce .fut::after{animation-duration:6s;opacity:.5}
.fut-rayos{position:absolute;left:50%;top:-60px;width:320px;height:320px;margin-left:-120px;opacity:.55;z-index:0;
  background:repeating-conic-gradient(rgba(255,255,255,.22) 0 7deg,transparent 7deg 15deg);animation:spin 24s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%)}
.fut-holo{position:absolute;inset:0;z-index:1;opacity:.6;mix-blend-mode:overlay;
  background:repeating-linear-gradient(60deg,rgba(255,255,255,.12) 0 5px,transparent 5px 11px),radial-gradient(circle at 70% 25%,rgba(255,255,255,.5),transparent 55%)}
.fut-izq{position:absolute;left:16px;top:24px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px}
.fut-g{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:56px;line-height:.82}
.fut-pos{font-family:'Bebas Neue',Impact,sans-serif;font-size:21px;letter-spacing:.05em;line-height:1}
.fband{width:27px;height:18px;border-radius:2px;margin-top:3px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.fesc{width:24px;height:30px}
.fut-av{position:absolute;right:2px;top:12px;width:146px;height:146px;z-index:2}
.fut-nom{position:absolute;left:12px;right:12px;top:160px;z-index:3;text-align:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.07em;
  border-top:2px solid var(--fl);border-bottom:2px solid var(--fl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.fut-stats{position:absolute;left:22px;right:22px;top:198px;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:1px 16px;font-size:12.5px;font-weight:800;letter-spacing:.03em}
.fut-stats span{display:flex;align-items:baseline;gap:5px}
.fut-stats b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:21px}
.fut-pie{position:absolute;left:0;right:0;bottom:22px;z-index:3;display:flex;justify-content:center;gap:10px;font-family:'Bebas Neue',Impact,sans-serif;font-size:12.5px;letter-spacing:.14em;opacity:.85}
.futMini{width:76px;height:110px;flex:none;position:relative}
.futMini .futw{transform:scale(.38);transform-origin:0 0;position:absolute;left:0;top:0}
.dorso-c{display:flex;flex-direction:column;align-items:center;padding-top:22px !important}
.dr-t{position:relative;z-index:3;font-family:'Bebas Neue',Impact,sans-serif;font-size:16px;letter-spacing:.14em;margin-top:14px}
.dorso-c .fesc{position:relative;z-index:3;width:44px;height:55px;margin:6px 0}
.dr-l{position:relative;z-index:3;display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:13px;font-weight:700;align-items:baseline}
.dr-l b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:22px;text-align:right}
.dr-h{position:relative;z-index:3;margin-top:8px;font-size:12px;font-weight:800;text-align:center;padding:0 16px}
.volteo{position:relative;width:200px;height:290px;margin:10px auto 0;cursor:pointer;transition:transform .32s ease-in-out}
.volteo .cara{position:absolute;inset:0}
.volteo.girando{transform:perspective(900px) rotateY(90deg)}
.volteo .dorso{display:none}
.volteo.volteada .frente{display:none}
.volteo.volteada .dorso{display:block}
.volteo:focus-visible{outline:3px solid #ffc400;outline-offset:6px;border-radius:12px}
/* ---------- Revelación de carta ---------- */
.overlay.revela{background:radial-gradient(circle at 50% 45%,rgba(26,36,90,.92),rgba(2,4,14,.97));overflow:hidden}
.rv{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.rv-rayos{position:absolute;left:50%;top:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;animation:spin 14s linear infinite;
  background:repeating-conic-gradient(var(--rc) 0 6deg,transparent 6deg 14deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%)}
.rv-rayos.bronce{--rc:rgba(220,150,90,.35)}.rv-rayos.plata{--rc:rgba(220,230,245,.35)}.rv-rayos.oro{--rc:rgba(255,200,40,.4)}
.rv-rayos.especial{--rc:rgba(255,210,74,.45)}.rv-rayos.heroe{--rc:rgba(180,130,255,.45)}.rv-rayos.icono{--rc:rgba(255,245,200,.55)}.rv-rayos.leyenda{--rc:rgba(255,140,80,.5)}
.rv-txt{position:relative;font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(28px,8vw,46px);line-height:1;letter-spacing:.05em;color:#fff;text-align:center;
  transform:scale(0);animation:pop .5s cubic-bezier(.3,1.7,.5,1) 1.3s forwards}
.rv-txt b{font-weight:400;color:#ffc400}
.rv-carta{position:relative;animation:rvCarta 1.5s cubic-bezier(.2,.9,.3,1) both}
@keyframes rvCarta{0%{transform:translateY(-110vh) rotateY(0) scale(.6)}60%{transform:translateY(0) rotateY(900deg) scale(1.2)}100%{transform:rotateY(1080deg) scale(1.12)}}
.rv .btn{position:relative;opacity:0;animation:fadeIn .4s 1.8s forwards}
/* ---------- Presentación del partido ---------- */
.intro{position:absolute;inset:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:rgba(4,8,24,.55);overflow:hidden}
.in-l,.in-r{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;padding:8px}
.in-l{background:linear-gradient(100deg,#d0102b,#7a0012);clip-path:polygon(0 0,100% 0,82% 100%,0 100%);transform:translateX(-110%)}
.in-r{background:linear-gradient(260deg,var(--rc),#0b1438 85%);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);transform:translateX(110%)}
.intro.anim .in-l{animation:inLado .6s cubic-bezier(.2,1.2,.4,1) forwards}
.intro.anim .in-r{animation:inLado .6s cubic-bezier(.2,1.2,.4,1) .12s forwards}
@keyframes inLado{to{transform:none}}
.in-vs{align-self:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(40px,12vw,84px);color:#ffc400;text-shadow:0 4px 0 #7a0012,0 0 20px rgba(255,196,0,.6);
  transform:scale(0);margin:0 -14px;z-index:2}
.intro.anim .in-vs{animation:pop .5s cubic-bezier(.3,1.7,.5,1) .55s forwards}
.in-bdg{display:grid;place-items:center;width:clamp(42px,11vw,66px);height:clamp(42px,11vw,66px);border-radius:14px;font-family:'Bebas Neue',Impact,sans-serif;
  font-size:clamp(18px,5vw,28px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);border:3px solid rgba(255,255,255,.6)}
.in-bdg.esp{background:linear-gradient(180deg,#cf1124 0 30%,#ffc400 30% 70%,#cf1124 70%)}
.in-nm{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(18px,5vw,32px);letter-spacing:.05em;line-height:1}
.in-real{font-size:clamp(10px,2.6vw,13px);opacity:.85;text-align:center;max-width:22ch;line-height:1.25}
.in-c{margin-top:2px}
.in-info{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);white-space:nowrap;font-size:clamp(10px,2.6vw,13px);color:#fff;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:99px;opacity:0;animation:fadeIn .4s .8s forwards}
.in-skip{position:absolute;right:8px;top:8px;z-index:3;font:inherit;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;border:none;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.intro.sale{animation:fuera .42s forwards}
@keyframes fuera{to{opacity:0}}
@media (max-width:430px){.in-c{display:none}}
.ondea{transform-box:fill-box;transform-origin:0% 50%;animation:ondea 1.1s ease-in-out infinite}
@keyframes ondea{50%{transform:skewY(10deg) scaleX(.82)}}
.futw .fut-stats{top:195px;gap:0 16px;line-height:1.02}
.futw .fut-stats b{font-size:18px}
.futw .fut-pie{bottom:19px;font-size:11px;gap:8px}
.futw .fut.dorso-c{padding:34px 14px 0 !important}
.futw .fut.dorso-c .dr-t{font-size:14px;letter-spacing:.08em;margin-top:0;text-align:center}
.futw .fut.dorso-c .fesc{width:38px;height:48px;margin:4px 0 2px}
.futw .fut.dorso-c .dr-l{font-size:12px;gap:0 14px}
.futw .fut.dorso-c .dr-l b{font-size:18px}
.futw .fut.dorso-c .dr-h{font-size:10.5px;margin-top:4px;padding:0 26px;line-height:1.25}
/* ---------- Modo ligero: sin efectos caros ---------- */
.ligero .fut::after,.ligero .futw .fut::after{animation:none;background:none}
.ligero .fut-holo{display:none}
.ligero .overlay{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(4,7,22,.92)}
.ligero .gol.show .rays{animation:fadeIn .3s forwards;opacity:.5}
.ligero .golFlash{text-shadow:0 6px 0 #a3001c}
.ligero .stage{box-shadow:none}
.ligero .card,.ligero .pcard,.ligero .camino-head{box-shadow:none}
.ligero .cnItem svg,.ligero .carta-top,.ligero .evo-carta{will-change:auto}
.ligero .gol.show .big span{animation:pop .35s var(--d) forwards}
.ligero .conf{animation-timing-function:linear}
@media (prefers-reduced-motion: reduce){ .conf{display:none} .gol.show .rays{animation:fadeIn .3s forwards} }
</style>

function mkFront(id){const g=$(id),q=s=>g.querySelector(s);

function animFrente(f,now){
  if(!f||!f.inner)return;
  f.inner.setAttribute("transform",`translate(0,${(Math.sin(now*0.003+f.seed)*1.6).toFixed(2)})`);
  const ph=(now+f.seed*900)%3900,s=ph<140?Math.abs(1-ph/70):1;
  f.ojos.setAttribute("transform",`translate(0,-152) scale(1,${Math.max(.08,s).toFixed(2)}) translate(0,152)`);
  let aR=-12;
  if(f.wave>now){const w=(f.wave-now)/1400,sube=Math.min(1,(1-w)*5),baja=Math.min(1,w*5),k=Math.min(sube,baja);
    aR=-12-148*k+Math.sin(now*0.022)*20*k;}
  f.armR.setAttribute("transform",`translate(28,-136) rotate(${aR.toFixed(1)})`);
  f.armL.setAttribute("transform",`translate(-28,-136) rotate(${(12+Math.sin(now*0.003+f.seed)*2).toFixed(1)})`);
  if(f.flow){const d=f.flow.dataset;f.flow.setAttribute("transform",`rotate(${(Math.sin(now*0.004+f.seed)*2.5*(+d.amp)).toFixed(2)} ${d.px} ${d.py})`);}
  f.rz.forEach((z,i)=>z.setAttribute("transform",`translate(${(Math.sin(now*0.008+i*0.9)*1.1).toFixed(2)},${(Math.cos(now*0.01+i*1.3)*1.1).toFixed(2)})`));
}

let AC=null,mudo=false;
function ac(){if(mudo)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==="suspended")AC.resume();return AC;}
function tone(f,d,{type="sine",v=.12,at=0,to=null}={}){const a=ac();if(!a)return;const t=a.currentTime+at;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
const sndOk=()=>{tone(660,.12,{type:"triangle"});tone(990,.2,{type:"triangle",at:.1});};
const sndKo=()=>tone(190,.28,{type:"sawtooth",v:.06,to:110});

function publico(dur){const a=ac();if(!a)return;const len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;
  const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=900;f.Q.value=.6;const g=a.createGain(),t=a.currentTime;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.4);g.gain.setValueAtTime(.35,t+dur*.55);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);}
function silbato(){const a=ac();if(!a)return;
  [0,.35,.7].forEach((at,k)=>{const t=a.currentTime+at,d=k===2?.6:.22;
    const o=a.createOscillator(),l=a.createOscillator(),lg=a.createGain(),g=a.createGain();
    o.frequency.value=2900;l.frequency.value=32;lg.gain.value=180;l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);g.gain.setValueAtTime(.07,t+d-.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);l.start(t);o.stop(t+d+.05);l.stop(t+d+.05);});}

function conSlot(sl,fn){const sv={av,prog};av={...AV_DEF,...((sl&&sl.av)||{})};prog=progDesde(sl&&sl.prog);try{return fn();}finally{av=sv.av;prog=sv.prog;}}
let armado=null,armadoT=0;
/* ---------- Entrenamiento: repasar los errores con el curso ---------- */
const LECCION={
  PRO:{t:"Los pronombres",r:["<b>Sujeto:</b> yo, tú, él/ella/usted, nosotros/as, vosotros/as, ellos/ellas/ustedes. Se deducen de la terminación del verbo: habl<b>as</b> → tú, jug<b>áis</b> → vosotros.",
    "<b>Usted</b> es para hablar con respeto a un adulto y va con el verbo en 3.ª persona.",
    "<b>Verbos pronominales</b> (llamarse, levantarse, entrenarse…): el pronombre va delante → <b>me</b> llamo, <b>te</b> llamas, <b>se</b> llama, <b>nos</b> llamamos, <b>os</b> llamáis, <b>se</b> llaman."]},
  PRE:{t:"El presente y las preguntas",r:["<b>-AR:</b> habl-o, -as, -a, -amos, -áis, -an. <b>-ER:</b> com-o, -es, -e, -emos, -éis, -en. <b>-IR:</b> viv-o, -es, -e, -imos, -ís, -en.",
    "<b>Preguntar:</b> ¿Qué? (quoi), ¿Quién? (qui), ¿Dónde? (où), ¿Cuándo? (quand), ¿Cómo? (comment), ¿Cuánto/s? (combien), ¿Por qué? (pourquoi). Llevan tilde y van entre ¿ ?."]},
  GUS:{t:"Los gustos",r:["<b>Gustar / encantar / apasionar</b> se conjugan con la cosa que gusta: me gust<b>a</b> el fútbol (singular), me gust<b>an</b> los goles (plural). Con un infinitivo: me gust<b>a</b> jugar.",
    "<b>El pronombre</b> depende de la persona: (a mí) <b>me</b>, (a ti) <b>te</b>, (a él/ella) <b>le</b>, (a nosotros) <b>nos</b>, (a vosotros) <b>os</b>, (a ellos) <b>les</b>.",
    "<b>También</b> responde a una frase afirmativa; <b>tampoco</b> a una negativa."]},
  SER:{t:"Ser, estar y hay",r:["<b>SER</b> (soy, eres, es, somos, sois, son): lo que algo es → identidad, carácter, descripción, nacionalidad, hora.",
    "<b>ESTAR</b> (estoy, estás, está, estamos, estáis, están): dónde está algo y cómo se siente hoy (estado pasajero).",
    "<b>HAY</b> (siempre igual): «il y a» → hay un balón, hay miles de personas."]},
  IRR:{t:"Irregulares, rutina y posesivos",r:["<b>Diptongos:</b> e → ie (querer: quiero, quieres, quiere… pero queremos), o → ue (poder: puedo… podemos), u → ue (jugar: juego… jugamos). Con nosotros y vosotros no hay diptongo.",
    "<b>Irregulares en yo:</b> tengo, hago, salgo, pongo, digo, voy, soy, estoy.",
    "<b>La rutina:</b> me levanto, me ducho, me acuesto (el pronombre delante). <b>La hora:</b> es la una / son las dos, las ocho… a las nueve.",
    "<b>Posesivos:</b> mi/mis, tu/tus, su/sus, nuestro/a/os/as, vuestro/a/os/as. Concuerdan con la cosa poseída: <b>sus</b> botas."]},
  FUT:{t:"Planes y obligaciones",r:["<b>IR A + infinitivo</b> (futuro próximo): voy, vas, va, vamos, vais, van → voy a marcar.",
    "<b>TENER QUE + infinitivo</b> (obligación personal): tengo que correr. <b>HAY QUE + infinitivo</b> (obligación general): hay que entrenar.",
    "<b>Muy + adjetivo/adverbio</b> (muy bien, muy rápido); <b>mucho</b> + nombre o detrás del verbo (corre mucho)."]}
};
let ENT=null;
let entDespues=null,ENTF=null,entAnim={k:"idle",t0:0,ph:0};
function abrirEntrenamiento(despues){
  const lista=(prog.fallos||[]).slice();
  if(!lista.length){if(despues)despues();return;}
  entDespues=despues||null;
  ENT={lista,i:0,ok:0,fase:"intro",m0:media(),tries:0};
  $("entrena").hidden=false;$("vestuario").innerHTML=vestuarioSVG();ENTF=mkFig("entAv");entAnim={k:"entra",t0:performance.now(),ph:0};
  pintarEntrenamiento();
}
function vestuarioSVG(){
  let taq="";for(let i=0;i<7;i++)taq+=`<g transform="translate(${30+i*78},40)"><rect width="66" height="150" rx="4" fill="${i%2?'#2b3f8f':'#24367c'}" stroke="#15204d" stroke-width="2"/><rect x="8" y="12" width="50" height="6" rx="3" fill="#15204d"/><rect x="8" y="26" width="50" height="6" rx="3" fill="#15204d"/><circle cx="54" cy="80" r="3" fill="#ffc400"/><text x="33" y="138" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="16" fill="#8fa3ff">${[7,9,10,11,14,19,24][i]}</text></g>`;
  return `<svg viewBox="0 0 600 340" class="vest" aria-hidden="true">
    <defs><linearGradient id="vsuelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a7a"/><stop offset="1" stop-color="#222d55"/></linearGradient>
      <pattern id="vbald" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#2c3a6b"/><rect x="1" y="1" width="38" height="38" fill="#31417a"/></pattern></defs>
    <rect width="600" height="340" fill="#1b2650"/><rect width="600" height="210" fill="url(#vbald)"/>
    <rect y="210" width="600" height="130" fill="url(#vsuelo)"/><rect y="208" width="600" height="4" fill="#4b5c96"/>
    ${taq}
    <g transform="translate(20,250)"><rect width="200" height="12" rx="4" fill="#8b5a2b" stroke="#4a2e12" stroke-width="2"/><rect x="18" y="12" width="10" height="34" fill="#4a2e12"/><rect x="172" y="12" width="10" height="34" fill="#4a2e12"/></g>
    <g id="cintaG" transform="translate(395,232)"><rect x="0" y="40" width="170" height="16" rx="6" fill="#1a1f33" stroke="#0b0e1c" stroke-width="2"/><rect x="6" y="43" width="158" height="10" rx="4" fill="#3b4466"/>
      <g id="cintaLineas">${Array.from({length:9},(_,i)=>`<rect x="${8+i*18}" y="44" width="4" height="8" fill="#6a76a8"/>`).join("")}</g>
      <rect x="150" y="-30" width="8" height="74" rx="3" fill="#2a3150"/><rect x="118" y="-34" width="52" height="14" rx="5" fill="#0d1433" stroke="#2a3150" stroke-width="2"/><rect x="124" y="-30" width="40" height="6" rx="2" fill="#ffc400" opacity=".7"/></g>
    <g id="rackG" transform="translate(236,292)"><rect width="110" height="10" rx="3" fill="#2a3150"/>${[0,1,2].map(i=>`<g transform="translate(${12+i*36},-8)"><rect x="0" y="2" width="30" height="5" rx="2" fill="#555c77"/><rect x="-5" y="-3" width="9" height="15" rx="2" fill="#0d1433"/><rect x="26" y="-3" width="9" height="15" rx="2" fill="#0d1433"/></g>`).join("")}</g>
    <g id="entAv" transform="translate(130,300)">${figura("entF",coloresAv(),optsAv())}</g>
    <g id="pesa" opacity="0"><rect x="-26" y="-4" width="52" height="8" rx="3" fill="#555c77"/><rect x="-34" y="-11" width="12" height="22" rx="3" fill="#0d1433"/><rect x="22" y="-11" width="12" height="22" rx="3" fill="#0d1433"/></g>
    <rect width="600" height="340" fill="url(#vig)" opacity=".4"/>
  </svg>`;
}
function animarVestuario(now){
  if(!ENTF||$("entrena").hidden)return;
  const t=now-entAnim.t0,k=entAnim.k;let x=130,y=300,pp=idle(now,0),rot=0,sx=1,py=0;
  const pesa=$("pesa"),lineas=$("cintaLineas");
  if(k==="entra"){const u=Math.min(1,t/1500);x=-60+190*u;entAnim.ph+=0.22;pp=run(entAnim.ph);if(u>=1){entAnim.k="idle";entAnim.t0=now;}}
  else if(k==="pesas"){const q=Math.sin(t*0.006);const lift=(q+1)/2;pp={leg:[-18,18,18,18],arm:[-30-120*lift,-20,-30-120*lift,-20],bob:lift*3};
    pesa.setAttribute("opacity","1");pesa.setAttribute("transform",`translate(${x+2},${y-96-94*lift})`);}
  else if(k==="cinta"){x=480;y=272;entAnim.ph+=0.3;pp=run(entAnim.ph);rot=-6;
    if(lineas)lineas.setAttribute("transform",`translate(${(-(t*0.08)%18).toFixed(1)},0)`);}
  else if(k==="fallo"){const q=Math.sin(t*0.01);pp={leg:[-6,10,8,12],arm:[20,-40,20,-40],bob:0};rot=10+q*2;py=0;}
  else if(k==="festejo"){const j=Math.abs(Math.sin(t*0.011));py=-j*26;pp={leg:[-20*j,15+40*j,16,24+30*j],arm:[-165,-15,165,15],bob:0};}
  if(k!=="pesas")pesa.setAttribute("opacity","0");
  pose(ENTF,{x,y:y+py,rot,sx:sx*ESC.an,sy:ESC.al,...pp});animarPelo(ENTF,now,k==="cinta"||k==="entra",entAnim.ph,false);
}
function pintarEntrenamiento(){
  const c=$("entCard");
  if(ENT.i>=ENT.lista.length){
    const n=ENT.ok;entAnim={k:n?"festejo":"idle",t0:performance.now(),ph:0};
    const t0=tierDe(ENT.m0),t1=tierDe(media());
    c.innerHTML=`<div class="tag">💪 Entrenamiento terminado</div>
      <div class="enRes"><b>${n}</b> de ${ENT.lista.length} errores corregidos</div>
      <div class="enFinal"><div class="futw ${t1.k} enMini">${cartaHTML("enFin")}</div>
        <div class="enMediaBig"><small>Media general</small><div><span>${ENT.m0}</span> → <b id="enMediaN">${ENT.m0}</b></div><small class="enTier">${t0.k!==t1.k?`¡Carta ${t1.n}!`:t1.n}</small></div></div>
      <p class="presDesc">${n?`Tu carta sube <b>+${n*3}</b> puntos.`:"Esta vez no has corregido ningún error. Lee bien la regla: lo volverás a ver en el próximo vestuario."}
        ${(prog.fallos||[]).length?`<br>Todavía te quedan <b>${prog.fallos.length}</b> por repasar.`:"<br>¡No te queda ningún error pendiente!"}</p>
      <div class="dos"><button class="btn" id="enOk" type="button">${entDespues?"¡Al partido! ⚽":"Volver"}</button></div>`;
    $("enOk").onclick=cerrarEntrenamiento;
    const nEl=$("enMediaN"),mf=media();if(mf>ENT.m0){const t=performance.now();const paso=()=>{const u=Math.min(1,(performance.now()-t)/1200);nEl.textContent=Math.round(ENT.m0+(mf-ENT.m0)*u);if(u<1)requestAnimationFrame(paso);else nEl.classList.add("salta");};setTimeout(paso,400);}
    return;
  }
  const e=ENT.lista[ENT.i],L=LECCION[e.cat]||LECCION.PRE,prog_=`${ENT.i+1} / ${ENT.lista.length}`;
  if(ENT.fase==="intro"){
    c.innerHTML=`<div class="tag">💪 El vestuario</div>
      <h2 id="enTit" class="enH">Corrige tus ${ENT.lista.length} ${ENT.lista.length===1?"error":"errores"}</h2>
      <ol class="enPasos"><li><b>Lee la regla</b> del curso que explica tu error.</li><li><b>Vuelve a responder</b> a la misma pregunta.</li><li>Cada error corregido: <b>+3</b> en la nota de ese tema (${[...new Set(ENT.lista.map(e=>CAT_CORTO[e.cat]||e.cat))].join(", ")}).</li></ol>
      <p class="nota centro">Si vuelves a fallar, no pasa nada: la pregunta volverá en el próximo vestuario.</p>
      <div class="dos"><button class="btn" id="enGo" type="button">¡Empezar!</button></div>`;
    $("enGo").onclick=()=>{ENT.fase="leccion";pintarEntrenamiento();};return;
  }
  if(ENT.fase==="leccion"){
    const d=document.createElement("div");d.innerHTML=frase({...e,ok:[e.ok],ops:null},false);
    c.innerHTML=`<div class="tag">💪 Entrenamiento · ${prog_}</div>${mediaChip()}
      <div class="enErr"><div class="enL">Tu error:</div><p class="enFrase">${e.antes}${e.antes&&!/[¿¡]$/.test(e.antes)?" ":""}<s>${esc(e.mio)}</s> <span class="inf">${e.verbo||"elige"}</span> ${e.despues}</p></div>
      <div class="enLec"><div class="enL">Paso 1 · Lee la regla · ${L.t}</div><ul>${L.r.map(r=>`<li>${r}</li>`).join("")}</ul>
        <div class="enPista">💡 ${esc(e.pista)}</div></div>
      <div class="dos"><button class="btn" id="enGo" type="button">${ENT.tries?"¡Ahora sí! Lo intento otra vez":"¡Lo tengo! Vuelvo a intentarlo"}</button></div>`;
    if(ENT.tries)c.querySelector(".enLec").classList.add("otraVez");
    $("enGo").onclick=()=>{ENT.fase="pregunta";pintarEntrenamiento();};
  }else{
    const f={antes:e.antes,verbo:e.verbo,ok:[e.ok],despues:e.despues,ops:e.ops,esc:e.esc,pista:e.pista};
    const h=f.ops?`<span class="hueco" id="enGap">&nbsp;</span>`:`<input id="enGap" class="gapin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" style="width:${Math.max(8.5,e.ok.length+3)}ch">`;
    const sa=(!f.antes||/[¿¡]$/.test(f.antes))?"":" ",sd=/^[,.;:!?…]/.test(f.despues)?"":" ";
    c.innerHTML=`<div class="tag">💪 Entrenamiento · ${prog_}</div>${mediaChip()}
      <div class="enL">Paso 2 · ${f.ops?"Elige la respuesta correcta":f.esc?"Escribe la palabra que falta":"Conjuga el verbo"}</div>
      <p class="actual enQ">${f.antes}${sa}${h} <span class="inf">${f.verbo||"elige"}</span>${sd}${f.despues}</p>
      <div class="opciones" id="enOps">${f.ops?[...f.ops].sort(()=>Math.random()-.5).map(t=>`<button type="button" class="opt" data-v="${esc(t)}">${esc(t)}</button>`).join(""):""}</div>
      <p class="fb" id="enFb"></p>
      <div class="dos">${f.ops?"":`<button class="btn" id="enVal" type="button">Validar</button>`}</div>`;
    const resolver=val=>{
      const v=respuesta(f,val),ok=f.ok.map(norm).includes(v)||f.ok.map(o=>sinAc(norm(o))).includes(sinAc(v));
      if(!v)return;
      const q=c.querySelector(".enQ"),fb=$("enFb");
      c.querySelectorAll("#enOps .opt").forEach(o=>{o.disabled=true;const n=norm(o.dataset.v);if(ok&&n===v)o.classList.add("bien");else if(n===v)o.classList.add("mal");});
      if($("enVal"))$("enVal").disabled=true;
      const d=c.querySelector(".dos"),sig=()=>{ENT.i++;ENT.tries=0;ENT.fase="leccion";entAnim={k:"idle",t0:performance.now(),ph:0};pintarEntrenamiento();};
      if(ok){sndOk();q.classList.remove("ko");q.classList.add("bien");ENT.ok++;entAnim={k:ENT.i%2?"cinta":"pesas",t0:performance.now(),ph:0};
        prog.fallos=(prog.fallos||[]).filter(x=>!(x.antes===e.antes&&x.ok===e.ok));
        const m0=media();prog.card[e.cat]=Math.min(99,(prog.card[e.cat]||50)+3);guardarProg();
        fb.className="fb ok";fb.innerHTML=`¡Corregido! <b>+3</b> en tu nota de <b>${CAT_CORTO[e.cat]||e.cat}</b>.`;animarMedia(m0,media());
        d.innerHTML=`<button class="btn" id="enNext" type="button">${ENT.i+1<ENT.lista.length?"Siguiente ›":"Terminar"}</button>`;$("enNext").onclick=sig;}
      else{sndKo();q.classList.add("ko");ENT.tries++;entAnim={k:"fallo",t0:performance.now(),ph:0};fb.className="fb ko";
        if(ENT.tries<3){fb.innerHTML=`Todavía no. Relee la regla con calma y vuelve a intentarlo (intento ${ENT.tries} de 3).`;
          d.innerHTML=`<button class="btn" id="enRe" type="button">📖 Releer la regla</button>`;$("enRe").onclick=()=>{ENT.fase="leccion";entAnim={k:"idle",t0:performance.now(),ph:0};pintarEntrenamiento();};}
        else{fb.innerHTML=`Tres intentos. Esta vez se queda pendiente: la volverás a ver en el próximo vestuario.`;
          d.innerHTML=`<button class="btn" id="enNext" type="button">${ENT.i+1<ENT.lista.length?"Siguiente ›":"Terminar"}</button>`;$("enNext").onclick=sig;}}
    };
    c.querySelectorAll("#enOps .opt").forEach(o=>o.onclick=()=>resolver(o.dataset.v));
    if($("enVal")){$("enVal").onclick=()=>resolver($("enGap").value);$("enGap").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();resolver($("enGap").value);}});if(fino)$("enGap").focus();}
  }
}
function mediaChip(){const t=tierDe(media());return `<div class="enMedia ${t.k}" id="enMedia"><small>Media</small><b id="enMediaV">${media()}</b><em>${t.n}</em></div>`;}
function animarMedia(m0,m1){const el=$("enMediaV"),box=$("enMedia");if(!el)return;const t=performance.now();
  const paso=()=>{const u=Math.min(1,(performance.now()-t)/900);el.textContent=Math.round(m0+(m1-m0)*u);if(u<1)requestAnimationFrame(paso);else{box.className="enMedia "+tierDe(m1).k;box.querySelector("em").textContent=tierDe(m1).n;}};
  box.classList.remove("sube");void box.offsetWidth;box.classList.add("sube");paso();}
function cerrarEntrenamiento(){$("entrena").hidden=true;ENT=null;ENTF=null;const d=entDespues;entDespues=null;if(d){d();return;}if(!$("camino").hidden)renderCamino();if(!$("fin").hidden&&$("aEntrenar")){const n=(prog.fallos||[]).length;$("aEntrenar").textContent=`💪 Entrenar (${n})`;$("aEntrenar").disabled=!n;}}
function abrirPartidas(){
  $("ptCard").innerHTML=`<div class="tag">Partidas guardadas</div><h2 id="ptTit">¿Con quién juegas?</h2>
    <div class="slots">${partidas.slots.map((sl,i)=>{
      const lleno=sl&&sl.av&&(sl.av.nombre||"").trim(),act=i===partidas.activo;
      if(!lleno)return `<div class="slot vacio${act?" activo":""}"><div><b>Partida ${i+1}</b><small>Vacía</small></div>
        <div class="acc"><button class="bJugar" type="button" data-nuevo="${i}">＋ Crear un jugador</button></div></div>`;
      return conSlot(sl,()=>{const gan=Object.values(prog.res).filter(x=>x.r==="V").length;
        return `<div class="slot${act?" activo":""}">${cartaHTML("sl"+i,true)}<div class="info"><b>${esc(capi(av.nombre.trim()))}${act?'<span class="badgeAct">Jugando</span>':""}</b>
          <small>Partida ${i+1} – Carta ${tierDe(media()).n} (${media()})</small><small>Nivel ${nivel()} – ${gan}/8 victorias${prog.campeon?" – 🏆":""}</small>
          <div class="acc">${act?"":`<button class="bJugar" type="button" data-jugar="${i}">▶ Jugar</button>`}
          <button class="bBorrar${armado===i?" armado":""}" type="button" data-borrar="${i}">${armado===i?"¿Seguro? Pulsa otra vez":"🗑️ Borrar"}</button></div></div></div>`;});
    }).join("")}</div>
    <p class="nota">Cada partida guarda su propio personaje y su propio camino. Para borrar, hay que pulsar dos veces.</p>
    <div class="dos"><button class="btn" id="ptOk" type="button">Cerrar</button></div>`;
  $("partidas").hidden=false;
  const c=$("ptCard");
  c.querySelectorAll("[data-jugar]").forEach(b=>b.onclick=()=>cambiarPartida(+b.dataset.jugar));
  c.querySelectorAll("[data-nuevo]").forEach(b=>b.onclick=()=>{const i=+b.dataset.nuevo;partidas.slots[i]={av:{...AV_DEF},prog:PROG0()};cambiarPartida(i);});
  c.querySelectorAll("[data-borrar]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.borrar;
    if(armado!==i){armado=i;clearTimeout(armadoT);armadoT=setTimeout(()=>{armado=null;if(!$("partidas").hidden)abrirPartidas();},3500);abrirPartidas();return;}
    armado=null;clearTimeout(armadoT);partidas.slots[i]=null;guardarPartidas();
    if(i===partidas.activo){const j=partidas.slots.findIndex(x=>x&&x.av&&(x.av.nombre||"").trim());
      if(j>=0)cambiarPartida(j,true);else{partidas.slots[i]={av:{...AV_DEF},prog:PROG0()};cambiarPartida(i);}}
    else abrirPartidas();});
  $("ptOk").onclick=cerrarPartidas;
}
function cerrarPartidas(){
  $("partidas").hidden=true;armado=null;
  if(!av.nombre.trim()&&crEl.hidden)abrirCreador();
}
function cambiarPartida(i,seguir){
  partidas.activo=i;guardarPartidas();
  const sl=partidas.slots[i];
  av={...AV_DEF,...((sl&&sl.av)||{})};if(!CAMISETAS[av.camiseta])av.camiseta="roja";
  prog=progDesde(sl&&sl.prog);
  actualizarAvatar();renderTitulo();mostrarCamino();
  if(seguir){abrirPartidas();return;}
  $("partidas").hidden=true;
  if(!av.nombre.trim())abrirCreador();else crEl.hidden=true;
}
$("verPartidas").onclick=abrirPartidas;
$("crPartidas").onclick=abrirPartidas;
if(!av.nombre.trim())abrirCreador();
</script>
